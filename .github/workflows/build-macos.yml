name: Build macOS (Apple Silicon)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    name: Build arm64 dmg
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build macOS dmg (arm64)
        id: build
        run: npx electron-builder --mac dmg --arm64 --publish never
        continue-on-error: true
        env:
          # 没有 Apple 开发者证书，跳过 electron-builder 的签名发现
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # 兜底：若 ad-hoc 签名在 CI 上校验失败，改出未签名的 dmg（功能一致，
      # 只是初次打开需要右键「打开」）。
      - name: Retry without ad-hoc signing
        if: steps.build.outcome == 'failure'
        run: npx electron-builder --mac dmg --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          SLATE_SKIP_ADHOC_SIGN: '1'

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: slate-macos-arm64-dmg
          path: dist.noindex/*.dmg
          if-no-files-found: error
