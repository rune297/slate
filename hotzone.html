<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
</style>
</head>
<body>
<script>
  // 顶部穿透感应层。窗口本身 setIgnoreMouseEvents(true, { forward: true })，
  // 点击会穿透到下面的标题栏/标签页，不影响任何既有操作；但鼠标移动消息会被转发进来，
  // 于是这里能读到 e.buttons —— 用来区分「拖窗口」和「主动下拉手势」。
  const { ipcRenderer } = require('electron');

  let last = 0;
  window.addEventListener('mousemove', (e) => {
    const now = Date.now();
    if (now - last < 8) return;
    last = now;
    ipcRenderer.send('hotzone:move', {
      x: e.screenX,
      y: e.screenY,
      buttons: e.buttons,
    });
  });

  window.addEventListener('mouseleave', () => {
    ipcRenderer.send('hotzone:leave');
  });

  window.addEventListener('mousedown', (e) => {
    ipcRenderer.send('dismiss:press', {
      x: e.screenX,
      y: e.screenY,
      button: e.button,
    });
    ipcRenderer.send('hotzone:leave');
  });
</script>
</body>
</html>
