<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
</style>
</head>
<body>
<script>
  // 全屏穿透层：面板展开时铺满整屏。窗口 setIgnoreMouseEvents(true, { forward: true })，
  // 点击会穿透到下面的应用（该干嘛干嘛），但鼠标移动消息转发进来，
  // 于是能读到 e.buttons —— 面板矩形之外一旦按下，主进程立刻收起面板。
  const { ipcRenderer } = require('electron');

  let last = 0;
  window.addEventListener('mousemove', (e) => {
    const now = Date.now();
    if (now - last < 8) return;
    last = now;
    ipcRenderer.send('dismiss:move', {
      x: e.screenX,
      y: e.screenY,
      buttons: e.buttons,
    });
  });
</script>
</body>
</html>
